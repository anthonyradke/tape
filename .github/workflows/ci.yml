# Tests the platform-free code on Linux against real decoders, then builds on Windows and runs the
# self-test there. That covers D3D11, both capture APIs, the pointer shaders and the AAC encoder.
# Hosted runners have a software GPU and no sound hardware, so NVENC, the video processor and
# WASAPI only run on a real machine. The UI test then runs the real app in a real WebView2 on the
# fake engine, to show that clips play, seek and make thumbnails, and that the overlay opens.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Test
        run: cargo test -p tape-core -p tape-engine -p nvenc
      - name: Make a clip for the shared-link conversion
        # 1440p at 120 fps, so the Windows job has to scale it and drop frames.
        run: |
          mkdir -p /tmp/share-fixture
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=2560x1440:rate=120 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 3 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -ac 2 -b:a 192k /tmp/share-fixture/clip.mp4

      - name: Keep the fake engine's video and audio for the UI test
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            /tmp/tape-e2e-*/*.frames
            /tmp/share-fixture/clip.mp4

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p tape-core --lib

      - name: Build
        run: cargo build --release -p tape

      - name: Self-test
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\self-test.txt"
          $p = Start-Process -FilePath target\release\tape.exe -ArgumentList "--self-test", $report -Wait -PassThru
          "exit code $($p.ExitCode)"
          Copy-Item "$env:TEMP\tape-selftest.aac" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { "::error::the self-test didn't write its report"; exit 1 }
          $lines = Get-Content $report
          $lines
          # What a hosted runner can run has to pass: displays, both capture APIs, the pointer shaders,
          # AAC, and a shared-link copy if one was made. Encode and the WASAPI lines need hardware it
          # doesn't have, so failures there are only shown.
          $section = ""
          $bad = @()
          foreach ($l in $lines) {
            if ($l -match '^\S') { $section = $l; continue } # section names aren't indented
            if ($l -notmatch 'FAILED') { continue }
            if ($section -in "Displays", "Capture", "Sharing" -or $l -match '^\s+AAC:') { $bad += "${section}: $($l.Trim())" }
            else { "::warning::self-test, ${section}: $($l.Trim())" }
          }
          foreach ($need in "Desktop Duplication", "Windows Graphics Capture", "Pointer overlay", "AAC") {
            if (-not ($lines -match "^\s+${need}: OK")) { $bad += "no `"${need}: OK`" line" }
          }
          $bad | ForEach-Object { "::error::self-test, $_" }
          if ($bad) { exit 1 }

      - name: Get the fake engine's video and audio
        uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}/fixtures

      - name: Shared-link copy
        shell: pwsh
        run: |
          $clip = Get-ChildItem "$env:RUNNER_TEMP\fixtures" -Recurse -Filter clip.mp4 | Select-Object -First 1
          $out = "$env:RUNNER_TEMP\share.mp4"
          $p = Start-Process -FilePath target\release\tape.exe -ArgumentList "--share-copy", "`"$($clip.FullName)`"", "`"$out`"", "`"$env:RUNNER_TEMP\share.log`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\share.out"
          Get-Content "$env:RUNNER_TEMP\share.out" | Select-Object -Last 2
          Get-Content "$env:RUNNER_TEMP\share.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { "::error::the shared-link copy failed"; exit 1 }

      - name: UI test
        shell: pwsh
        run: |
          $home_ = "$env:RUNNER_TEMP\ui"
          $folder = "$home_\Tape"
          $config = "$env:APPDATA\com.anthonyradke.tape"
          New-Item -ItemType Directory -Force $config, $folder | Out-Null
          @{ folder = $folder } | ConvertTo-Json | Set-Content "$config\settings.json"
          $frames = Get-ChildItem "$env:RUNNER_TEMP\fixtures" -Recurse -Filter video.frames | Select-Object -First 1
          $env:TAPE_FAKE = "1"
          $env:TAPE_FAKE_VIDEO = $frames.FullName
          $env:TAPE_FAKE_AUDIO = Join-Path $frames.DirectoryName "audio.frames"
          $env:TAPE_FAKE_FOLDER = $folder
          $env:TAPE_FAKE_GOP = "30"
          $report = "$env:RUNNER_TEMP\ui-test.json"
          $env:TAPE_UI_TEST = $report
          $app = Start-Process -FilePath target\release\tape.exe -PassThru
          $finished = $app.WaitForExit(180000)
          Copy-Item "$env:LOCALAPPDATA\com.anthonyradke.tape\logs\engine.log" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          if (-not $finished) { $app.Kill(); "::error::the UI test never finished"; exit 1 }
          Get-Content $report
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $bad = @()
          if ($r.failure) { $bad += $r.failure }
          if ($r.count -ne 2) { $bad += "expected 2 clips, got $($r.count)" }
          foreach ($c in $r.clips) {
            if ($c.game -ne "Test Game") { $bad += "$($c.name): filed under $($c.game)" }
            if (-not $c.thumb) { $bad += "$($c.name): no thumbnail, $($c.thumbError)" }
            if ($c.playError) { $bad += "$($c.name): won't play, $($c.playError)" }
            if ($c.playedTo -le 0.3) { $bad += "$($c.name): didn't advance, reached $($c.playedTo)" }
            if ($c.audioBytes -le 0) { $bad += "$($c.name): no audio decoded" }
            if ($c.seekedTo -le 0) { $bad += "$($c.name): didn't seek" }
          }
          $stamp = "^Test Game \d{4}\.\d\d\.\d\d - \d\d\.\d\d\.\d\d\.\d\d"
          if ((Split-Path $r.clipPath -Leaf) -notmatch "$stamp\.DVR\.mp4$") { $bad += "clip name: $($r.clipPath)" }
          if ((Split-Path $r.recordingPath -Leaf) -notmatch "$stamp\.mp4$") { $bad += "recording name: $($r.recordingPath)" }
          if ($r.thumbsListed -ne 2) { $bad += "thumbnails listed: $($r.thumbsListed)" }
          $l = $r.library
          if ($l.keyframes -lt 2) { $bad += "trim: only $($l.keyframes) keyframes listed" }
          if ($l.trimmedName -notmatch "$stamp trim\.mp4$") { $bad += "trim: copy named $($l.trimmedName)" }
          if ($l.trimmedKind -ne "recording") { $bad += "trim: copy listed as $($l.trimmedKind)" }
          $t = $l.trimmed
          if (-not $t -or $t.playError -or $t.seekedTo -le 0 -or $t.audioBytes -le 0) { $bad += "trim: copy doesn't play: $($t | ConvertTo-Json -Compress)" }
          elseif ([math]::Abs($t.duration - $l.expectedSeconds) -gt 0.1) { $bad += "trim: copy lasts $($t.duration), expected $($l.expectedSeconds)" }
          if (-not $l.starred) { $bad += "star didn't stick" }
          if ($l.renamedName -ne "renamed by the test.mp4") { $bad += "rename: got $($l.renamedName)" }
          if (-not $l.renamedStarred) { $bad += "rename lost the star" }
          if (-not $l.renamedThumb) { $bad += "rename lost the thumbnail" }
          if (-not $l.oldNameGone) { $bad += "rename left the old name listed" }
          if (-not $l.clashRefused) { $bad += "rename overwrote another clip" }
          if ($l.afterDelete -ne 2) { $bad += "delete: $($l.afterDelete) clips left, expected 2" }
          if (-not $l.outsideRefused) { $bad += "delete accepted a file outside the clips folder" }
          if (-not $r.overlayOpen[0]) { $bad += "the overlay didn't open" }
          if (-not $r.overlayOpen[1]) { $bad += "the overlay isn't excluded from capture" }
          if (-not $r.overlayOpen[2]) { $bad += "the overlay isn't a side panel" }
          if (-not $r.overlayOpen[3]) { $bad += "the overlay took focus, which knocks a game out of fullscreen" }
          if ($r.overlayClosed[0]) { $bad += "the overlay didn't close" }
          $bad | ForEach-Object { "::error::$_" }
          if ($bad) { exit 1 }

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: |
            ${{ runner.temp }}/self-test.txt
            ${{ runner.temp }}/tape-selftest.aac
            ${{ runner.temp }}/ui-test.json
            ${{ runner.temp }}/engine.log
            ${{ runner.temp }}/share.mp4
            ${{ runner.temp }}/share.log

  share-copy:
    # Decodes what the Windows job's conversion made: H.264 at 1080p60 with AAC, as every browser plays.
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: self-test
          path: out
      - name: Check the copy
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          f=$(find out -name share.mp4 | head -1)
          v=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -of csv=p=0 "$f")
          a=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f")
          echo "video: $v  audio: $a"
          IFS=, read -r codec width height rate <<< "$v"
          fps=$(awk -F/ '{ printf "%.0f", $1 / $2 }' <<< "$rate")
          # One test per line: under bash -e only the last part of an && list stops the script.
          test "$codec,$width,$height,$fps" = "h264,1920,1080,60"
          test "$a" = "aac"
          # moov before mdat, so a link starts playing before the whole file has downloaded.
          python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(); o=0; t=[]
          while o < len(d): s,k=struct.unpack('>I4s',d[o:o+8]); s=struct.unpack('>Q',d[o+8:o+16])[0] if s==1 else s; t.append(k); o+=s
          print(t); assert t.index(b'moov') < t.index(b'mdat')" "$f"
          ffmpeg -v error -i "$f" -f null - 2>&1 | tee errors.txt
          test ! -s errors.txt
