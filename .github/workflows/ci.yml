# Tests the platform-free code on Linux against real decoders, then builds on Windows and runs the
# self-test there. Hosted runners have no NVIDIA GPU, so that exercises everything except NVENC:
# D3D11, both capture APIs, the video processor, the shader compiler, WASAPI and the AAC encoder.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Test
        run: cargo test -p tape-core -p tape-engine -p nvenc

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p tape-core --lib

      - name: Build
        run: cargo build --release -p tape

      # Hosted runners have no sound hardware. Scream is a virtual sound card, which gives WASAPI
      # a real endpoint to capture from.
      - name: Install a virtual sound card
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Service audio*
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile Scream.zip
          Expand-Archive Scream.zip -DestinationPath Scream
          $inf = Get-ChildItem Scream -Recurse -Filter Scream.inf | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $sys = Get-ChildItem Scream -Recurse -Filter Scream.sys | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $devcon = Get-ChildItem Scream -Recurse -Filter 'devcon*x64*.exe' | Select-Object -First 1
          $cert = (Get-AuthenticodeSignature $sys.FullName).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite"); $store.Add($cert); $store.Close()
          Push-Location $inf.DirectoryName
          & $devcon.FullName install Scream.inf "*Scream"
          Pop-Location
          Start-Sleep -Seconds 5

      - name: Self-test
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\self-test.txt"
          $p = Start-Process -FilePath target\release\tape.exe -ArgumentList "--self-test", $report -Wait -PassThru
          "exit code $($p.ExitCode)"
          Get-Content $report
          Copy-Item "$env:TEMP\tape-selftest.aac" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          if (Select-String -Path $report -Pattern "FAILED" -Quiet) { "::warning::the self-test reported failures" }
          if (-not (Test-Path $report)) { exit 1 }

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: |
            ${{ runner.temp }}/self-test.txt
            ${{ runner.temp }}/tape-selftest.aac
