# Pushing a tag like v0.4.0 builds the signed installer on Windows and publishes it as a GitHub
# release with the latest.json that installed copies of tape check for updates. The full test suite
# (ci.yml) runs beside the build, and the release is only published when both pass on the tagged
# commit. Running it by hand (Actions > release > Run workflow) only builds and keeps the installer
# as a workflow artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes the release can write to the repo.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-12
        with:
          toolchain: stable

      # Restores the cache ci.yml's Windows job saves on main; tag runs don't save their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: false

      # The prebuilt binary from Tauri's release, checked against its known hash. Building it from
      # source took about 10 minutes whenever the cache missed.
      - name: Install the Tauri CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_CLI: "2.12.4"
          TAURI_CLI_SHA256: 3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b
        run: |
          $zip = "$env:RUNNER_TEMP\cargo-tauri.zip"
          gh release download "tauri-cli-v$env:TAURI_CLI" -R tauri-apps/tauri -p cargo-tauri-x86_64-pc-windows-msvc.zip -O $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:TAURI_CLI_SHA256) { throw "the Tauri CLI download doesn't match its hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\cargo-tauri"
          "$env:RUNNER_TEMP\cargo-tauri" >> $env:GITHUB_PATH

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} doesn't match tauri.conf.json version $version" }

      - name: Build
        shell: pwsh
        # The signing key only here: every other step, the actions and the build scripts included,
        # has no use for it.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/src-tauri
          cargo tauri build

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tape-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tape-installer
          path: installer

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $exe = Get-Item "installer/tape_${version}_x64-setup.exe"
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          # Release notes are the annotated tag's message.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = (git tag -l --format="%(contents)" $tag | Out-String).Trim()
          if (-not $notes) { $notes = "tape $version" }
          @{
            version  = $version
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
          Set-Content notes.md $notes -Encoding utf8NoBOM
          gh release create $tag $exe.FullName latest.json --title "tape $version" --notes-file notes.md
