# Pushing a tag like v0.4.0 builds the signed installer on Windows and publishes it as a GitHub
# release with the latest.json that installed copies of tape check for updates. Running it by hand
# (Actions > release > Run workflow) only builds and keeps the installer as a workflow artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-12
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) { cargo install tauri-cli --version "^2" --locked }

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} doesn't match tauri.conf.json version $version" }

      - name: Test
        run: cargo test -p tape-core --lib

      - name: Build
        shell: pwsh
        # The signing key only here: every other step, the actions and the build scripts the tests
        # compile and run included, has no use for it.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/src-tauri
          cargo tauri build

      - name: Keep the installer
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tape-installer
          path: target/release/bundle/nsis/*-setup.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $exe = Get-Item "target/release/bundle/nsis/tape_${version}_x64-setup.exe"
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          # Release notes are the annotated tag's message.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = (git tag -l --format="%(contents)" $tag | Out-String).Trim()
          if (-not $notes) { $notes = "tape $version" }
          @{
            version  = $version
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
          Set-Content notes.md $notes -Encoding utf8NoBOM
          gh release create $tag $exe.FullName latest.json --title "tape $version" --notes-file notes.md
