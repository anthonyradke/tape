<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tape</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-tab="capture">
  <div class="shell">
    <aside class="nav" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#161616"/><circle cx="21" cy="32" r="8.5" fill="none" stroke="#ece8df" stroke-width="5"/><circle cx="43" cy="32" r="8.5" fill="none" stroke="#ece8df" stroke-width="5"/><path d="M21 43.2h22" stroke="#ece8df" stroke-width="5" stroke-linecap="round"/></svg>
        <span data-tauri-drag-region>tape</span>
      </div>
      <nav class="nav-items" role="tablist">
        <button class="nav-tab on press" data-tab-name="capture" role="tab"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><circle class="fill" cx="8" cy="8" r="2.2" fill="currentColor" stroke="none"/></svg><span>Capture</span></button>
        <button class="nav-tab press" data-tab-name="gallery" role="tab"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.8"/><path d="M6.8 6.2v3.6L9.8 8z" fill="currentColor"/></svg><span>Clips</span></button>
        <button class="nav-tab press" data-tab-name="settings" role="tab"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg><span>Settings</span></button>
      </nav>
      <div class="nav-foot">
        <div class="nav-status" id="tb-state"></div>
        <button class="nav-upd press" id="upd" data-act="update" hidden></button>
      </div>
    </aside>

    <main>
      <section class="page" id="page-capture" aria-label="Capture">
        <header class="top" data-tauri-drag-region>
          <h1 data-tauri-drag-region>Capture</h1>
          <div class="sp" data-tauri-drag-region></div>
          <button class="btn sm ghost press" data-act="open-folder">Open folder</button>
        </header>
        <div class="scroll">
          <div class="col">
            <div class="plate">
              <div class="cell"><div class="cell-head"><div class="cap">Instant replay</div><button class="toggle" id="t-replay" data-toggle="replay" role="switch" aria-label="Instant replay"></button></div><div class="val" id="p-replay"></div><div class="meter"><i id="p-replay-fill"></i></div></div>
              <div class="cell"><div class="cell-head"><div class="cap">Recording</div></div><div class="val" id="p-rec"></div><div class="sub" id="p-rec-sub"></div></div>
              <div class="cell"><div class="cell-head"><div class="cap">Capturing</div></div><div class="val" id="p-fps"></div><div class="sub" id="p-fps-sub"></div></div>
              <div class="cell"><div class="cell-head"><div class="cap">Bitrate</div></div><div class="val" id="p-rate"></div><div class="sub" id="p-rate-sub"></div></div>
            </div>

            <div class="actions">
              <button class="btn pri big press" id="b-clip" data-act="clip"><span>Save clip</span><kbd id="k-clip"></kbd></button>
              <button class="btn big press" id="b-rec" data-act="record"><i class="rec-dot"></i><span id="b-rec-text">Start recording</span><kbd id="k-rec"></kbd></button>
            </div>

            <div id="alerts"></div>

            <section class="sec">
              <div class="sec-head"><h3>Recent</h3><button class="link" data-tab-name="gallery">All clips</button></div>
              <div class="card clips" id="clips"></div>
            </section>
          </div>
        </div>
      </section>

      <section class="page gallery" id="gallery" aria-label="Clips"></section>

      <section class="page" id="page-settings" aria-label="Settings">
        <header class="top" data-tauri-drag-region><h1 data-tauri-drag-region>Settings</h1><div class="sp" data-tauri-drag-region></div></header>
        <div class="scroll" id="settings-scroll"><div class="col" id="settings"></div></div>
      </section>
    </main>
  </div>

  <div class="win-ctl">
    <button data-act="win-min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
    <button class="close" data-act="win-close" title="Close to tray" aria-label="Close to tray"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>

  <div id="report" class="modal" hidden>
    <div class="scrim-bg" data-act="close-report"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Self-test report">
      <div class="dlg-head">
        <h2>Self-test</h2>
        <div class="sp"></div>
        <button class="btn sm press" data-act="copy-report">Copy</button>
        <button class="btn sm ghost icon press" data-act="close-report" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <pre id="report-text"></pre>
    </div>
  </div>
  <div id="links" class="modal" hidden>
    <div class="scrim-bg" data-act="close-links"></div>
    <div class="dialog links-box" role="dialog" aria-modal="true" aria-label="Shared links">
      <div class="dlg-head">
        <h2>Shared links</h2>
        <div class="sp"></div>
        <button class="btn sm ghost icon press" data-act="close-links" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div id="links-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
