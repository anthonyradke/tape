<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tape overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="overlay-page" data-pane="settings">
  <header class="ov-head">
    <div class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#161616"/><circle cx="21" cy="32" r="8.5" fill="none" stroke="#ece8df" stroke-width="5"/><circle cx="43" cy="32" r="8.5" fill="none" stroke="#ece8df" stroke-width="5"/><path d="M21 43.2h22" stroke="#ece8df" stroke-width="5" stroke-linecap="round"/></svg><span>tape</span></div>
    <div class="nav-status" id="tb-state"></div>
    <div class="sp"></div>
    <button class="btn sm ghost icon press" data-act="hide" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </header>
  <section class="ov-top">
    <div class="ov-game" id="ov-game"></div>
    <div class="quality" id="quality"></div>
    <div class="plate" style="--cols: 2">
      <div class="cell"><div class="cell-head"><div class="cap">Instant replay</div><button class="toggle" id="t-replay" data-toggle="replay" role="switch" aria-label="Instant replay"></button></div><div class="val" id="p-replay"></div><div class="meter"><i id="p-replay-fill"></i></div></div>
      <div class="cell"><div class="cell-head"><div class="cap">Recording</div></div><div class="val" id="p-rec"></div><div class="sub" id="p-rec-sub"></div></div>
    </div>
    <div class="actions">
      <button class="btn pri big press" id="b-clip" data-act="clip"><span id="b-clip-text">Save clip</span><kbd id="k-clip"></kbd></button>
      <button class="btn big press" id="b-rec" data-act="record"><i class="rec-dot"></i><span id="b-rec-text">Start recording</span><kbd id="k-rec"></kbd></button>
    </div>
    <div class="seg ov-tabs">
      <button data-pane-name="settings">Settings</button>
      <button data-pane-name="clips">Clips</button>
    </div>
  </section>
  <section class="ov-pane" id="ov-settings"></section>
  <section class="gallery" id="gallery" aria-label="Clips"></section>
  <div id="toast" class="toast" role="status"></div>
  <script src="shared.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
